<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Angel One">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<title>Angel One</title>
<style>
:root{--blue:#4161df;--ink:#16202b;--sub:#4c5968;--line:#e5e7ec;--safe:env(safe-area-inset-top)}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{min-height:100dvh}
.login-shell{min-height:100dvh;max-width:430px;margin:0 auto;padding:calc(var(--safe) + 28px) 17px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;background:#fff}
.brand-row{display:flex;align-items:flex-start;justify-content:space-between;height:72px}
.brand-row img.logo{width:160px;height:auto;object-fit:contain;object-position:left top}
.brand-row img.trust{width:112px;height:auto;object-fit:contain;object-position:right top}
.hero{display:flex;justify-content:center;align-items:center;margin-top:4px;height:285px}
.hero img{width:320px;max-width:92%;height:100%;object-fit:contain}
.copy{text-align:center;margin-top:8px}
.copy h1{font-size:26px;line-height:1.15;margin:0 0 10px;font-weight:800}
.copy p{font-size:17px;line-height:1.42;margin:0;color:var(--sub)}
.dots{display:flex;justify-content:center;gap:7px;margin:17px 0 28px}.dots span{width:6px;height:6px;border-radius:50%;background:#b7bdc8}.dots .active{width:22px;border-radius:5px;background:var(--blue)}
.field-label{font-size:18px;font-weight:800;margin:0 0 10px}
.phone-wrap{height:58px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;padding:0 15px;gap:14px}
.cc{font-size:17px;color:#161c25}.phone-wrap input{border:0;outline:0;flex:1;font-size:17px;color:#161c25;background:transparent;min-width:0}
.phone-wrap input::placeholder{color:#20252e;opacity:1}
.spacer{flex:1;min-height:72px}
.terms{font-size:12px;line-height:1.35;color:var(--sub);margin-bottom:14px}
.terms a{color:var(--blue);text-decoration:none}
.cta{display:block;width:100%;height:56px;border:0;border-radius:7px;background:var(--blue);color:#fff;font-size:18px;font-weight:800;letter-spacing:.2px}
.client{display:block;text-align:center;color:var(--blue);font-size:17px;font-weight:750;margin-top:22px;text-decoration:none}
.sim{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom) + 7px);font-size:8px;color:#7f8793;background:rgba(255,255,255,.94);padding:2px 5px;border-radius:6px;border:1px solid #eef0f5}
@media(max-height:760px){
 .hero{height:245px}.copy h1{font-size:24px}.dots{margin-bottom:20px}.spacer{min-height:35px}
}
@media(min-width:600px){body{background:#eef1f7}.login-shell{box-shadow:0 18px 55px rgba(0,0,0,.12)}}
</style>
</head>
<body>
<main class="login-shell">
  <div class="brand-row">
    <img class="logo" src="login-logo.png" alt="AngelOne">
    <img class="trust" src="login-trust.png" alt="Trusted by 3.5 Crore+ Indians">
  </div>

  <div class="hero"><img src="login-hero.png" alt=""></div>

  <div class="copy">
    <h1>100% Paperless KYC</h1>
    <p>Invest &amp; trade in Mutual Funds, Stocks, IPOs, ETFs, F&amp;O,<br>SGBs, Commodities &amp; Currencies</p>
  </div>

  <div class="dots"><span class="active"></span><span></span><span></span><span></span></div>

  <label class="field-label" for="mobile">Enter Mobile Number</label>
  <div class="phone-wrap">
    <span class="cc">+91</span>
    <input id="mobile" inputmode="numeric" maxlength="10" placeholder="9790785164" aria-label="Dummy mobile number">
  </div>

  <div class="spacer"></div>

  <div class="terms">By clicking GET OTP, I agree to the Angel One <a href="#">TnC</a> and Research Agreements. <a href="#">READ MORE</a></div>
  <button class="cta" id="getotp">GET OTP</button>
  <a class="client" href="otp.html">Login via Client ID</a>
</main>
<div class="sim">Simulation · No real credentials</div>
<script>
document.getElementById('getotp').addEventListener('click',()=>location.href='otp.html');
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
