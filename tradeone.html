<div class="notice">Simulation · No real credentials</div>

<script>
(function(){
  const anchor=588.00;
  let price = anchor;
  let prev = anchor;
  let candles = [];
  for(let i=0;i<12;i++){
    const base = anchor + (Math.random()-0.5)*0.55;
    candles.push({o:base,h:base+Math.random()*0.28,l:base-Math.random()*0.28,c:base+(Math.random()-0.5)*0.22});
  }

  const canvas = document.getElementById('tradeLiveCanvas');
  const ctx = canvas.getContext('2d');
  const ohlc = document.getElementById('tradeOhlc');
  const bs = document.getElementById('tradeBuySell');
  const priceBox = document.getElementById('tradePrice');

  function resize(){
    const r=canvas.getBoundingClientRect();
    canvas.width=Math.max(1,Math.round(r.width*devicePixelRatio));
    canvas.height=Math.max(1,Math.round(r.height*devicePixelRatio));
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }

  function fmt(n){return n.toFixed(2);}
  function updateText(last){
    const d=last.c-last.o, pct=d/last.o*100;
    const up=d>=0;
    ohlc.innerHTML =
      '<span style="color:#ddd">O'+fmt(last.o)+' H'+fmt(last.h)+' L'+fmt(last.l)+' C'+fmt(last.c)+' </span>'+
      '<span style="color:'+(up?'#19c99a':'#ff4d5a')+'">'+(up?'+':'')+fmt(d)+' ('+(up?'+':'')+pct.toFixed(2)+'%)</span>';
    bs.innerHTML =
      '<span class="buy-btn">BUY @ '+fmt(last.c+0.10)+'</span>'+
      '<span class="sell-btn">SELL @ '+fmt(last.c)+'</span>';
    priceBox.textContent=fmt(last.c);
    priceBox.style.background=up?'#10a98a':'#ef4550';
    priceBox.style.color='white';
  }

  function draw(){
    const r=canvas.getBoundingClientRect(), w=r.width, h=r.height;
    ctx.clearRect(0,0,w,h);
    const vals=candles.flatMap(c=>[c.h,c.l]);
    let min=Math.min(...vals)-0.2, max=Math.max(...vals)+0.2;
    if(max-min<1.5){ const mid=(max+min)/2; min=mid-.75; max=mid+.75; }
    const y=v=>h-(v-min)/(max-min)*h;
    const step=w/candles.length;
    candles.forEach((c,i)=>{
      const x=i*step+step*.55, up=c.c>=c.o;
      const col=up?'#09a889':'#f04452';
      ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,y(c.h));ctx.lineTo(x,y(c.l));ctx.stroke();
      const top=Math.min(y(c.o),y(c.c)), bot=Math.max(y(c.o),y(c.c));
      ctx.fillRect(x-step*.16,top,step*.32,Math.max(2,bot-top));
    });
    const last=candles[candles.length-1];
    ctx.strokeStyle=last.c>=last.o?'rgba(25,201,154,.75)':'rgba(255,77,90,.75)';
    ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(0,y(last.c));ctx.lineTo(w,y(last.c));ctx.stroke();ctx.setLineDash([]);
    updateText(last);
  }

  
function tick(){
    if(window.AngelSim) price=AngelSim.load().price;

    const last=candles[candles.length-1];
    last.c=price;
    last.h=Math.max(last.h,last.c,last.o);
    last.l=Math.min(last.l,last.c,last.o);
    if(Math.random()<0.28){
      const o=last.c;
      candles.push({o:o,h:o+0.05,l:o-0.05,c:o});
      if(candles.length>12)candles.shift();
    }
    draw();
  }

  
  candles[candles.length-1]={o:609.55,h:609.70,l:609.00,c:609.20};
  price=609.20;

  if(window.AngelSim){const s=AngelSim.load();price=s.price;candles[candles.length-1].c=price;} resize(); draw();
  window.addEventListener('resize',()=>{resize();draw();});
  setInterval(tick, 1400);
})();
</script>


<script>
(function(){
  const KEY='angelone_hindzinc_sim_v1';
  const ANCHOR=588.00;
  const PREV=593.20;
  const QTY=416;
  const INVESTED=253000.0;

  function load(){
    try {
      const x=JSON.parse(localStorage.getItem(KEY)||'null');
      if(x && typeof x.price==='number' && Date.now()-x.ts<120000) return x;
    } catch(e){}
    return {price:ANCHOR,ts:Date.now()};
  }
  function save(price){
    try{localStorage.setItem(KEY,JSON.stringify({price:price,ts:Date.now()}));}catch(e){}
  }
  window.AngelSim={
    KEY,ANCHOR,PREV,QTY,INVESTED,
    load,save,
    money:function(n){
      return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
    },
    signedMoney:function(n){
      return (n<0?'₹ -':'₹ +')+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
    },
    calc:function(px){
      const current=QTY*px;
      const today=QTY*(px-PREV);
      const todayPct=(px-PREV)/PREV*100;
      const overall=current-INVESTED;
      const overallPct=overall/INVESTED*100;
      return {current,today,todayPct,overall,overallPct};
    },
    color:function(el,v){
      if(!el)return;
      el.style.color=v<0?'#ff4d5a':v>0?'#19c99a':'';
    }
  };
})();
</script>
