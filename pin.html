<input id="cleanValue" class="clean-input" type="password"
       inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Enter PIN" aria-label="Enter PIN">
<button id="cleanProceed" class="clean-proceed" type="button" style="top:63.45%;" disabled>Proceed</button>
</div><div class="notice">Simulation · No real credentials</div>


<script>
(() => {
  const input = document.getElementById('cleanValue');
  const button = document.getElementById('cleanProceed');
  const sync = () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
    button.disabled = input.value.length !== 4;
  };
  input.addEventListener('input', sync);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !button.disabled) location.href = 'portfolio.html';
  });
  button.addEventListener('click', () => {
    if (!button.disabled) location.href = 'portfolio.html';
  });
  sync();
})();
</script>
