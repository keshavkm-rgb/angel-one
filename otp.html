<script>
(() => {
  const input = document.getElementById('cleanValue');
  const button = document.getElementById('cleanProceed');
  const sync = () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
    button.disabled = input.value.length !== 6;
  };
  input.addEventListener('input', sync);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !button.disabled) location.href = 'pin.html';
  });
  button.addEventListener('click', () => {
    if (!button.disabled) location.href = 'pin.html';
  });
  sync();
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body></html>
