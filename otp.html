<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Angel One"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="./apple-touch-icon.png?v=12"><link rel="icon" href="favicon.png?v=icon-final-58840-9"><link rel="stylesheet" href="app.css"><title>Verify OTP</title></head><body><div class="otpwrap"><div class="otpblue"><div style="font-size:38px">←</div><div class="logo"><img src="app-icon-512.png"></div></div><div class="sheet"><h1>Verify Mobile Number with OTP</h1><p>We have sent an OTP to your mobile number and registered email address</p><div style="margin-top:34px;font-size:16px">Mobile Number</div><div class="card soft" style="margin:10px 0 24px;font-size:18px">+91 9790785164 <span style="float:right;color:#4161df">✎</span></div><div class="row"><div style="font-size:17px">Enter OTP</div><div class="muted">Resend in <span class="red">00 : 54</span></div></div><div class="otpboxes" id="otpboxes"><input maxlength="1" inputmode="numeric" type="password" data-i="0"><input maxlength="1" inputmode="numeric" type="password" data-i="1"><input maxlength="1" inputmode="numeric" type="password" data-i="2"><input maxlength="1" inputmode="numeric" type="password" data-i="3"><input maxlength="1" inputmode="numeric" type="password" data-i="4"><input maxlength="1" inputmode="numeric" type="password" data-i="5"></div><div class="red" style="margin-top:14px;font-size:13px">ⓘ Didn't receive SMS? Check your registered email!</div></div><script>const xs=[...document.querySelectorAll("#otpboxes input")];xs.forEach((x,i)=>x.addEventListener("input",()=>{x.value=x.value.replace(/\D/g,"").slice(0,1);if(x.value&&i<5)xs[i+1].focus();if(xs.every(y=>y.value.length===1))setTimeout(()=>location.href="pin.html",180)}));</script></div><div class="notice">Simulation · No real credentials</div><script src="app.js"></script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
